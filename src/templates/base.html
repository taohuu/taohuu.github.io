<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="{{CSS_PATH}}">
</head>
<body data-theme="light">

  <header class="header" id="header">
    <div class="container header-inner">
      <a href="{{HOME_URL}}" class="logo">{{SITE_NAME}}</a>
      <nav class="nav">
        <a href="{{HOME_URL}}" class="nav-link{{HOME_ACTIVE}}">首页</a>
        <a href="#" class="nav-link">关于</a>
        <a href="#" class="nav-link">归档</a>
      </nav>
      <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
        <svg class="icon icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="icon icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="main">
    <div class="container">
{{CONTENT}}
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <p class="footer-text">&copy; 2026 {{SITE_NAME}}. Made with ❤️</p>
      <div class="footer-social">
        <a href="{{SOCIAL_GITHUB}}" class="social-link">GitHub</a>
        <a href="{{SOCIAL_TWITTER}}" class="social-link">Twitter</a>
        <a href="#" class="social-link">RSS</a>
      </div>
    </div>
  </footer>

  <script src="{{JS_PATH}}"></script>
</body>
</html>
